<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Clock & Countdown Timer</title>

    <!-- Connecting CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Digital Clock</h1>

        <div id="clock">00:00:00</div>

        <h2>New Year Countdown</h2>

        <div id="countdown">
            00d 00h 00m 00s
        </div>

    </div>

    <!-- Connecting JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
